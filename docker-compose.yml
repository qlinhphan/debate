services:
  backend:
    build:
      context: ./back
    container_name: communicate-backend
    env_file:
      - ./back/.env
    depends_on:
      - mongo
    volumes:
      - backend_data:/app/back/data
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: communicate-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  frontend:
    build:
      context: ./front
    container_name: communicate-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped
volumes:
  backend_data:
  mongo_data:
